[package]
name = "system_monitor"
version = "0.1.0"
edition = "2018"

[dependencies]
actix-web = "4.0"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.22"         # For fetching system info (CPU, memory, etc.)
rand = "0.8"             # For simulating load with random data
chrono = "0.4"           # For handling timestamps