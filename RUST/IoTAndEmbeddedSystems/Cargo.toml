[package]
name = "iot_firmware"
version = "0.1.0"
edition = "2021"

[dependencies]
rand = "0.8"                    # Random data generation
serde = { version = "1.0", features = ["derive"] } # Serialization
serde_json = "1.0"              # JSON formatting
reqwest = { version = "0.11", features = ["json"] } # HTTP client
aes = "0.7"                     # AES encryption library
base64 = "0.13"                 # Base64 encoding for secure data transmission
tokio = { version = "1", features = ["full"] }    # Async runtime for networking