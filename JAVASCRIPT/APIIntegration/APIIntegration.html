<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalized Travel Planner</title>
</head>

<body>
    <h1>Personalized Travel Planner</h1>
    <form id="travelForm">
        <label for="destination">Destination:</label>
        <input type="text" id="destination" name="destination" value="Paris" required><br><br>
        <label for="startDate">Start Date:</label>
        <input type="date" id="startDate" name="startDate" value="2025-06-01" required><br><br>
        <label for="endDate">End Date:</label>
        <input type="date" id="endDate" name="endDate" value="2025-06-10" required><br><br>
        <button type="submit">Generate Itinerary</button>
    </form>

    <div id="itineraryResult"></div>

    <script>
        document.getElementById('travelForm').addEventListener('submit', async function (event) {
            event.preventDefault();
            const destination = document.getElementById('destination').value;
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;

            const response = await fetch('/create-itinerary', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ destination, startDate, endDate })
            });
            const data = await response.json();
            document.getElementById('itineraryResult').innerHTML = `
                <h3>Your Travel Itinerary:</h3>
                <p><strong>Destination:</strong> ${data.destination}</p>
                <p><strong>Weather:</strong> ${data.weather.main.temp}°C, ${data.weather.weather[0].description}</p>
                <p><strong>Social Recommendations:</strong></p>
                <ul>
                    ${data.socialRecommendations.map(rec => `<li>${rec}</li>`).join('')}
                </ul>
                <p><strong>Map Location:</strong> ${data.map}</p>
            `;
        });
    </script>
</body>

</html>
