<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Art Showcase</title>
    <style>
        /* Global Styles */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f7f7f7;
            color: #333;
        }

        h1 {
            text-align: center;
            margin-top: 50px;
            font-size: 2em;
            color: #4CAF50;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
        }

        .category-container {
            display: flex;
            justify-content: space-around;
            margin-bottom: 50px;
        }

        .category {
            background-color: #4CAF50;
            color: white;
            padding: 20px;
            width: 30%;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .category:hover {
            background-color: #45a049;
        }

        /* Gallery Container */
        .gallery-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            gap: 20px;
        }

        .artwork {
            width: 300px;
            height: 300px;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .artwork h3 {
            font-size: 1.2em;
            margin-bottom: 20px;
        }

        .css-art {
            width: 100%;
            height: 100%;
        }

        /* Animations */
        .css-animation {
            background-color: #ff6347;
            border-radius: 50%;
            width: 100px;
            height: 100px;
            margin: 0 auto;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-50px);
            }
        }

        /* 3D Effect */
        .css-3d {
            width: 100px;
            height: 100px;
            margin: 0 auto;
            background-color: #4CAF50;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            transform: rotateY(45deg);
            animation: rotate3d 3s infinite linear;
        }

        @keyframes rotate3d {
            0% {
                transform: rotateY(0deg);
            }
            100% {
                transform: rotateY(360deg);
            }
        }

        /* Pixel Art */
        .css-pixel-art {
            width: 100px;
            height: 100px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
        }

        .css-pixel-art div {
            width: 20px;
            height: 20px;
        }

        .pixel-1 { background-color: #f00; }
        .pixel-2 { background-color: #0f0; }
        .pixel-3 { background-color: #00f; }
        .pixel-4 { background-color: #ff0; }
        .pixel-5 { background-color: #0ff; }

        /* Random Artwork Button */
        .random-artwork-btn {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            font-size: 1.2em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.3s;
        }

        .random-artwork-btn:hover {
            background-color: #45a049;
        }

    </style>
</head>
<body>

    <h1>CSS Art Showcase</h1>

    <div class="container">
        <div class="category-container">
            <div class="category" onclick="filterCategory('animation')">
                <h3>CSS Animations</h3>
            </div>
            <div class="category" onclick="filterCategory('3d')">
                <h3>CSS 3D Effects</h3>
            </div>
            <div class="category" onclick="filterCategory('pixel-art')">
                <h3>CSS Pixel Art</h3>
            </div>
        </div>

        <div class="gallery-container" id="gallery-container">
            <!-- Generated Artworks will be added here -->
        </div>

        <button class="random-artwork-btn" onclick="generateRandomArtworks()">Generate Random Artworks</button>
    </div>

    <script>
        // Random Artwork Generation
        const generateRandomArtworks = () => {
            const categories = ['animation', '3d', 'pixel-art'];
            const galleryContainer = document.getElementById('gallery-container');
            galleryContainer.innerHTML = '';  // Clear existing artworks

            for (let i = 0; i < 9; i++) {
                const category = categories[Math.floor(Math.random() * categories.length)];
                const artwork = document.createElement('div');
                artwork.classList.add('artwork');
                artwork.innerHTML = `<h3>Random ${category}</h3>`;
                
                if (category === 'animation') {
                    artwork.innerHTML += `<div class="css-art css-animation"></div>`;
                } else if (category === '3d') {
                    artwork.innerHTML += `<div class="css-art css-3d"></div>`;
                } else if (category === 'pixel-art') {
                    artwork.innerHTML += `
                        <div class="css-art css-pixel-art">
                            <div class="pixel-1"></div>
                            <div class="pixel-2"></div>
                            <div class="pixel-3"></div>
                            <div class="pixel-4"></div>
                            <div class="pixel-5"></div>
                            <div class="pixel-1"></div>
                            <div class="pixel-2"></div>
                            <div class="pixel-3"></div>
                            <div class="pixel-4"></div>
                            <div class="pixel-5"></div>
                            <div class="pixel-1"></div>
                            <div class="pixel-2"></div>
                            <div class="pixel-3"></div>
                            <div class="pixel-4"></div>
                            <div class="pixel-5"></div>
                        </div>`;
                }

                galleryContainer.appendChild(artwork);
            }
        };

        // Filter Artworks by Category
        const filterCategory = (category) => {
            const galleryContainer = document.getElementById('gallery-container');
            galleryContainer.innerHTML = '';  // Clear existing artworks

            if (category === 'animation') {
                for (let i = 0; i < 3; i++) {
                    const artwork = document.createElement('div');
                    artwork.classList.add('artwork');
                    artwork.innerHTML = `<h3>CSS Animation ${i + 1}</h3><div class="css-art css-animation"></div>`;
                    galleryContainer.appendChild(artwork);
                }
            } else if (category === '3d') {
                for (let i = 0; i < 3; i++) {
                    const artwork = document.createElement('div');
                    artwork.classList.add('artwork');
                    artwork.innerHTML = `<h3>CSS 3D Effect ${i + 1}</h3><div class="css-art css-3d"></div>`;
                    galleryContainer.appendChild(artwork);
                }
            } else if (category === 'pixel-art') {
                for (let i = 0; i < 3; i++) {
                    const artwork = document.createElement('div');
                    artwork.classList.add('artwork');
                    artwork.innerHTML = `<h3>CSS Pixel Art ${i + 1}</h3><div class="css-art css-pixel-art">
                        <div class="pixel-1"></div>
                        <div class="pixel-2"></div>
                        <div class="pixel-3"></div>
                        <div class="pixel-4"></div>
                        <div class="pixel-5"></div>
                    </div>`;
                    galleryContainer.appendChild(artwork);
                }
            }
        };

        // Initialize with random artworks
        generateRandomArtworks();
    </script>

</body>
</html>
