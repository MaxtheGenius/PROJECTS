<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Data Visualization Platform</title>
    <style>
        /* Styling for the platform */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }

        header {
            background-color: #333;
            color: white;
            padding: 10px 0;
            text-align: center;
        }

        .container {
            width: 90%;
            margin: 20px auto;
        }

        #controls {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        #controls select, #controls button {
            padding: 10px;
            margin-right: 10px;
            cursor: pointer;
        }

        #chart-container {
            width: 100%;
            height: 400px;
            border: 1px solid #ccc;
            background-color: white;
            position: relative;
        }

        #download-btn {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }

        #download-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <header>
        <h1>Interactive Data Visualization Platform</h1>
    </header>

    <div class="container">
        <div id="controls">
            <select id="chart-type" onchange="updateChart()">
                <option value="bar">Bar Chart</option>
                <option value="line">Line Chart</option>
                <option value="pie">Pie Chart</option>
            </select>
            <button onclick="generateRandomData()">Generate Random Data</button>
            <button id="download-btn" onclick="downloadChart()">Download Chart</button>
        </div>

        <div id="chart-container"></div>
    </div>

    <script>
        let chartData = [];
        let chartType = 'bar'; // Default chart type
        const chartContainer = document.getElementById('chart-container');

        // Function to generate random data for different domains
        function generateRandomData() {
            const randomData = generateRandomDataset();
            chartData = randomData;
            updateChart();
        }

        // Function to generate random dataset (finance, climate, demographics)
        function generateRandomDataset() {
            const domain = ['finance', 'climate', 'demographics'][Math.floor(Math.random() * 3)];
            let data = [];

            if (domain === 'finance') {
                // Finance: Random stock prices
                for (let i = 0; i < 5; i++) {
                    data.push({ label: `Stock ${i + 1}`, value: Math.random() * 1000 });
                }
            } else if (domain === 'climate') {
                // Climate: Random temperatures (in Celsius)
                for (let i = 0; i < 12; i++) {
                    data.push({ label: `Month ${i + 1}`, value: (Math.random() * 30 - 10).toFixed(1) });
                }
            } else {
                // Demographics: Random population numbers
                for (let i = 0; i < 5; i++) {
                    data.push({ label: `Region ${i + 1}`, value: Math.floor(Math.random() * 1000000) });
                }
            }

            return data;
        }

        // Function to update the chart based on selected type
        function updateChart() {
            chartType = document.getElementById('chart-type').value;
            chartContainer.innerHTML = ''; // Clear the previous chart
            if (chartType === 'bar') {
                drawBarChart(chartData);
            } else if (chartType === 'line') {
                drawLineChart(chartData);
            } else if (chartType === 'pie') {
                drawPieChart(chartData);
            }
        }

        // Function to draw a bar chart
        function drawBarChart(data) {
            const svg = createSVGElement();
            data.forEach((item, index) => {
                const barWidth = 50;
                const barHeight = item.value * 3; // Scaling the value for visibility
                const x = index * (barWidth + 20);
                const y = 400 - barHeight;

                // Create bars
                const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                rect.setAttribute('x', x);
                rect.setAttribute('y', y);
                rect.setAttribute('width', barWidth);
                rect.setAttribute('height', barHeight);
                rect.setAttribute('fill', '#007bff');

                // Create labels
                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', x + barWidth / 2);
                text.setAttribute('y', y - 10);
                text.setAttribute('text-anchor', 'middle');
                text.setAttribute('fill', '#333');
                text.textContent = item.label;

                svg.appendChild(rect);
                svg.appendChild(text);
            });
            chartContainer.appendChild(svg);
        }

        // Function to draw a line chart
        function drawLineChart(data) {
            const svg = createSVGElement();
            const points = data.map((item, index) => {
                return `${index * 100},${400 - item.value * 3}`;
            }).join(' ');

            // Create line
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
            line.setAttribute('points', points);
            line.setAttribute('fill', 'none');
            line.setAttribute('stroke', '#007bff');
            line.setAttribute('stroke-width', '3');

            svg.appendChild(line);

            // Create labels
            data.forEach((item, index) => {
                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', index * 100);
                text.setAttribute('y', 400 - item.value * 3 - 10);
                text.setAttribute('fill', '#333');
                text.textContent = item.label;
                svg.appendChild(text);
            });

            chartContainer.appendChild(svg);
        }

        // Function to draw a pie chart
        function drawPieChart(data) {
            const svg = createSVGElement();
            let total = data.reduce((sum, item) => sum + item.value, 0);
            let cumulativeAngle = 0;

            data.forEach((item, index) => {
                const sliceAngle = (item.value / total) * 360;
                const x1 = Math.cos((cumulativeAngle - 90) * Math.PI / 180) * 100 + 150;
                const y1 = Math.sin((cumulativeAngle - 90) * Math.PI / 180) * 100 + 150;
                cumulativeAngle += sliceAngle;
                const x2 = Math.cos((cumulativeAngle - 90) * Math.PI / 180) * 100 + 150;
                const y2 = Math.sin((cumulativeAngle - 90) * Math.PI / 180) * 100 + 150;

                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                const d = `M150,150 L${x1},${y1} A100,100 0 0,1 ${x2},${y2} Z`;
                path.setAttribute('d', d);
                path.setAttribute('fill', `hsl(${(index * 360 / data.length)}, 100%, 60%)`);
                svg.appendChild(path);
            });

            chartContainer.appendChild(svg);
        }

        // Function to create an SVG element
        function createSVGElement() {
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('width', '400');
            svg.setAttribute('height', '400');
            return svg;
        }

        // Function to download the chart as an SVG file
        function downloadChart() {
            const svg = chartContainer.querySelector('svg');
            const serializer = new XMLSerializer();
            const svgString = serializer.serializeToString(svg);
            const blob = new Blob([svgString], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);

            const link = document.createElement('a');
            link.href = url;
            link.download = 'chart.svg';
            link.click();
            URL.revokeObjectURL(url);
        }

        // Initial chart setup
        updateChart();
    </script>
</body>
</html>
